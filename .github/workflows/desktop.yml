# デスクトップ版（Mac アプリ）を作って、Releases の「desktop-latest」に置く。
# main にマージされるたびに作り直す。Actions のページから手動でも動かせる。
# PR では作れるかどうかの確認だけして、できた dmg は Actions の成果物に置く（Releases には出さない）
name: Desktop app (macOS)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web のファイルを dist/ に集める
        run: ./scripts/prepare-dist.sh

      # Apple シリコンでも Intel でも動くユニバーサル版
      - name: アプリを作る
        run: npx --yes @tauri-apps/cli@2.12.1 build --target universal-apple-darwin --bundles dmg

      - name: PR のときは成果物として置く
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DailyFlash-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: desktop-latest タグを今のコミットに付け直す
        if: github.event_name != 'pull_request'
        run: |
          git tag -f desktop-latest
          git push -f origin desktop-latest

      - name: Releases に置く
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: デイリーフラッシュ デスクトップ版（最新）
          body: |
            main の最新（${{ github.sha }}）から作った Mac 版です。
            DailyFlash_*.dmg をダウンロードして開き、DailyFlash を「アプリケーション」に入れてください。
            Apple の署名をしていないので、初回は「システム設定 → プライバシーとセキュリティ」の「このまま開く」で起動します。
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          make_latest: true
