<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>デイリーフラッシュ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=LINE+Seed+JP:wght@400;700&family=Noto+Sans:wght@400&family=Noto+Sans+JP:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="#/flash" data-route="flash">デイリーフラッシュ</a>
    <a href="#/add" data-route="add">単語の追加</a>
    <a href="#/test" data-route="test">テスト</a>
    <a href="#/list" data-route="list">単語一覧</a>
  </nav>

  <!-- デイリーフラッシュ -->
  <section class="view" id="view-flash" hidden>
    <!-- スワイプした側の画面端だけうっすら色づく -->
    <div class="glow glow-left" id="glow-left"></div>
    <div class="glow glow-right" id="glow-right"></div>
    <header class="session-head">
      <div class="remaining"><span id="remaining-count">0</span><span class="unit">枚</span></div>
      <div class="bar"><div class="bar-fill" id="session-progress"></div></div>
    </header>

    <div class="stage" id="stage">
      <div class="card-wrap" id="card-wrap">
        <div class="card" id="card">
          <div class="face front">
            <div class="word en" id="card-word"></div>
            <div class="ipa" id="card-ipa"></div>
          </div>
          <div class="face back">
            <div class="meaning ja" id="card-meaning"></div>
            <button class="ai-btn" id="ai-btn" type="button">AI解説</button>
          </div>
        </div>
      </div>
    </div>

    <div class="result summary" id="result" hidden>
      <h1 class="ja">おつかれ</h1>

      <div class="sum-row">
        <div class="ring-box" id="sum-acc-ring">
          <div class="ring-label">
            <span class="ring-cap ja sum-green">正答率</span>
            <span class="ring-num en sum-green" id="sum-acc">0</span>
          </div>
        </div>
        <div class="sum-side">
          <h2 class="sum-head ja">一度間違えた単語</h2>
          <ul class="sum-missed" id="sum-missed"></ul>
        </div>
      </div>

      <div class="sum-row">
        <div class="ring-box streak-badge">
          <div class="ring-label">
            <span class="ring-cap ja">連続記録</span>
            <span class="ring-num ja"><span class="en" id="sum-streak">0</span>日</span>
          </div>
        </div>
        <div class="sum-side">
          <h2 class="sum-month en" id="sum-month"></h2>
          <div class="sum-week" id="sum-week"></div>
        </div>
      </div>

      <div class="sum-row">
        <div class="ring-box" id="sum-week-ring">
          <div class="ring-label">
            <span class="ring-cap ja sum-dark">今週</span>
            <span class="ring-num en sum-dark" id="sum-week-count">0</span>
          </div>
        </div>
        <div class="sum-side sum-compare ja" id="sum-compare"></div>
      </div>

      <p class="sub" id="res-note"></p>
      <button class="btn" id="res-more" hidden>続けて出題する</button>
      <button class="link dev" id="res-again" hidden>もう一度（開発用：今日の回答を巻き戻す）</button>
    </div>
  </section>

  <!-- テスト -->
  <section class="view" id="view-test" hidden>
    <div class="glow glow-left" id="t-glow-left"></div>
    <div class="glow glow-right" id="t-glow-right"></div>
    <header class="session-head">
      <div class="remaining"><span id="t-remaining">0</span><span class="unit">問</span></div>
      <div class="bar"><div class="bar-fill" id="t-progress"></div></div>
    </header>

    <div class="stage" id="t-stage">
      <div class="card-wrap" id="t-wrap">
        <div class="card tcard">
          <div class="face">
            <div class="meaning ja" id="t-question"></div>
            <form class="t-write" id="t-write" hidden>
              <input class="t-input en" id="t-input" placeholder="write the answer..." autocomplete="off" autocapitalize="off" spellcheck="false">
              <p class="t-correct en" id="t-correct"></p>
            </form>
            <div class="t-choices" id="t-choices" hidden></div>
            <form class="t-translate" id="t-translate" hidden>
              <input class="t-input t-sentence en" id="t-sinput" placeholder="write the answer..." autocomplete="off" autocapitalize="off" spellcheck="false">
              <div class="t-input t-sentence en" id="t-sview" hidden></div>
              <p class="t-status" id="t-status"></p>
              <p class="t-comment" id="t-comment"></p>
            </form>
            <button class="ai-btn" id="t-ai-btn" type="button" hidden>AI解説</button>
          </div>
        </div>
      </div>
    </div>

    <div class="result summary" id="t-result" hidden>
      <h1 class="ja" id="t-title">テスト終了</h1>
      <p class="sub" id="t-note"></p>

      <div class="sum-row" id="t-row-score">
        <div class="ring-box" id="t-score-ring">
          <div class="ring-label">
            <span class="ring-cap ja sum-green">スコア</span>
            <span class="ring-num en sum-green" id="t-score">0</span>
            <span class="ring-sub en sum-green" id="t-score-frac"></span>
          </div>
        </div>
        <div class="sum-side">
          <h2 class="sum-head ja">間違えた単語</h2>
          <ul class="sum-missed t-missed" id="t-missed"></ul>
        </div>
      </div>

      <div class="sum-row" id="t-row-types">
        <div class="ring-box" id="t-type-ring">
          <div class="ring-label">
            <span class="ring-cap ja sum-dark"><span class="t-cap-dot"></span>形式別</span>
          </div>
        </div>
        <div class="sum-side">
          <ul class="t-types" id="t-types"></ul>
        </div>
      </div>

      <div class="sum-row" id="t-row-history">
        <div class="ring-box streak-badge">
          <div class="ring-label">
            <span class="ring-cap ja">ベスト</span>
            <span class="ring-num en" id="t-best">0</span>
          </div>
        </div>
        <div class="sum-side">
          <div class="sum-compare ja" id="t-compare"></div>
          <div class="t-history" id="t-history"></div>
        </div>
      </div>

      <button class="btn" id="t-again">もう一度テストする</button>
    </div>
  </section>

  <!-- AI解説 -->
  <div class="explain" id="explain" hidden>
    <div class="ex-panel" role="dialog" aria-label="AI解説">
      <header class="ex-title">
        <span>AI解説</span>
        <button class="ex-close" id="ex-close" type="button" aria-label="閉じる">×</button>
      </header>
      <div class="ex-scroll">
        <section class="ex-box ex-top" id="ex-top">
          <div class="ex-word en" id="ex-word"></div>
          <div class="ex-def">
            <span class="ex-pos" id="ex-pos"></span>
            <p class="ex-meaning" id="ex-meaning"></p>
          </div>
        </section>
        <div id="ex-body"></div>
      </div>
      <form class="ex-ask" id="ex-form">
        <input id="ex-question" placeholder="AIに追加で質問する" autocomplete="off">
        <button class="ex-send" id="ex-send" aria-label="送信">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M16.1401 2.95907L7.11012 5.95907C1.04012 7.98907 1.04012 11.2991 7.11012 13.3191L9.79012 14.2091L10.6801 16.8891C12.7001 22.9591 16.0201 22.9591 18.0401 16.8891L21.0501 7.86907C22.3901 3.81907 20.1901 1.60907 16.1401 2.95907ZM16.4601 8.33907L12.6601 12.1591C12.5101 12.3091 12.3201 12.3791 12.1301 12.3791C11.9401 12.3791 11.7501 12.3091 11.6001 12.1591C11.3101 11.8691 11.3101 11.3891 11.6001 11.0991L15.4001 7.27907C15.6901 6.98907 16.1701 6.98907 16.4601 7.27907C16.7501 7.56907 16.7501 8.04907 16.4601 8.33907Z"/></svg>
        </button>
      </form>
    </div>
  </div>

  <!-- 単語の追加 -->
  <section class="view narrow" id="view-add" hidden>
    <h1 class="title">単語の追加</h1>
    <form id="add-single" class="row">
      <input id="add-word" class="en" placeholder="英単語" autocomplete="off" required>
      <input id="add-meaning" class="ja" placeholder="日本語訳" autocomplete="off" required>
      <button class="btn">追加</button>
    </form>
    <p class="sub">まとめて追加（1行に「英単語,日本語」）</p>
    <form id="add-bulk">
      <textarea id="add-bulk-text" rows="10" placeholder="chore,雑用&#10;detect,見つける"></textarea>
      <button class="btn">まとめて追加</button>
    </form>
    <ul class="added" id="added-list"></ul>
  </section>

  <!-- 単語一覧 -->
  <section class="view" id="view-list" hidden>
    <div class="list-head">
      <h1 class="title">単語一覧</h1>
      <div class="list-tools">
        <label class="toggle"><input type="checkbox" id="opt-sound"> 効果音</label>
        <label class="toggle"><input type="checkbox" id="opt-invert"> スワイプ方向を反転</label>
        <label class="toggle">Gemini APIキー <input type="password" id="opt-apikey" class="apikey" placeholder="キーを貼り付け" autocomplete="off"></label>
        <button class="link" id="export-json">JSONを書き出す</button>
      </div>
    </div>
    <p class="sub" id="list-summary"></p>
    <table class="words">
      <thead><tr><th>英単語</th><th>発音記号</th><th>日本語訳</th><th>段階</th><th>次回</th><th></th></tr></thead>
      <tbody id="list-body"></tbody>
    </table>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/ipa.js"></script>
  <script src="js/haptic.js"></script>
  <script src="js/swipe.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/explain.js"></script>
  <script src="js/test.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
